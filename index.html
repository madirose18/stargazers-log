<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">GitHub activity</p>
        <h1>Stargazers log</h1>
        <p>A log of the repositories I've starred.</p>
      </header>

      <section aria-labelledby="repositories-heading">
        <h2 id="repositories-heading">Starred repositories</h2>
        <p id="status" class="status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
